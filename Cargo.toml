[package]
name = "cortex-m-std-dummy"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/823984418/cortex-m-std-dummy"
description = "A dummy/stub implementation of Rust std for Cortex-M processors, providing standard library APIs (alloc, fs, io, thread, etc.) for bare-metal embedded development with feature-gated support."
keywords = ["cortex-m", "embedded", "no_std", "std", "bare-metal"]
categories = ["embedded", "hardware-support", "no-std"]
license = "MIT OR Apache-2.0"

[dependencies]

[dependencies.libc]
version = "0.2"

[dependencies.cortex-m]
version = "0.7"
default-features = false

[dependencies.libm]
version = "0.2.16"

[features]
all = [
    "alloc",
    "atomic",
    "fd",
    "fs",
    "io",
    "pal",
    "process",
    "sync",
    "thread",
    "thread_local",
    "unwind",
    "math",
]
alloc = []
atomic = []
fd = []
fs = []
io = []
pal = []
process = []
sync = []
thread = []
thread_local = []
unwind = []
math = []

linkage_weak = []
nightly_linkage = []